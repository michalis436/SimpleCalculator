<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Simple Calculator</h1>
    <div class="input-container">
    <label for="number1">Enter the 1st number:</label>
    <input type="text" id="number1">
    </div>
    <br>
    <div class = "input-container">
    <label for = "number2">Enter the 2nd number:</label>
    <input type="text" id="number2">
    </div>
    <br>
    <button type="button" class="Calculate" id="additionButton">Add</button>
    <button type="button" class="Calculate" id="subtractButton">Subtract</button>
    <button type="button" class="Calculate" id="multiplyButton">Multiply</button>
    <button type="button" class="Calculate" id="divideButton">Divide</button>
    <button type="button" class="Calculate" id="clearButton">Clear</button>
    <br>
    <script src="Calc.js"></script>
    <p>The Result Is: <span id="result"></span></p>
</body>
</html>
